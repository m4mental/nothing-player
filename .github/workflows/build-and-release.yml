name: Build & Release Android APK & Deploy Pages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/nothing-player-release.jks
            echo "Release Keystore decoded successfully!"
          else
            echo "KEYSTORE_BASE64 secret not provided, using fallback build signing"
          fi

      - name: Build Android APKs
        working-directory: ./android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NothingPlayer-APKs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

      - name: Prepare Release Assets
        run: |
          ROOT_DIR=$(pwd)
          mkdir -p release-assets
          
          # Copy release or debug APKs
          if [ -d "android/app/build/outputs/apk/release" ]; then
            cd android/app/build/outputs/apk/release/
            for f in *.apk; do
              if [ -f "$f" ]; then
                echo "Copying release $f to $ROOT_DIR/release-assets/"
                cp "$f" "$ROOT_DIR/release-assets/${f/app-/NothingPlayer-}"
              fi
            done
            cd "$ROOT_DIR"
          fi

          if [ -d "android/app/build/outputs/apk/debug" ]; then
            cd android/app/build/outputs/apk/debug/
            for f in *.apk; do
              if [ -f "$f" ]; then
                echo "Copying debug $f to $ROOT_DIR/release-assets/"
                cp "$f" "$ROOT_DIR/release-assets/${f/app-/NothingPlayer-}"
              fi
            done
            cd "$ROOT_DIR"
          fi

          if [ -d "dist" ]; then
            cd dist && zip -r "$ROOT_DIR/release-assets/nothing-player-web-bundle.zip" . && cd "$ROOT_DIR"
          fi

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          COMMITS_LOG=$(git log -n 10 --pretty=format:"- [%h] %s (%an)")

          cat << EOF > release_notes.md
          # 🔴 NOTHING PLAYER v2.0 // MULTI-ARCH ANDROID RELEASE

          > **Build Timestamp:** ${DATE}  
          > **Commit:** \`${COMMIT_HASH}\` by @${COMMIT_AUTHOR}  
          > **Latest Push Note:** ${COMMIT_MSG}  

          ---

          ### 📲 Download APK (Choose by Architecture)

          | Architecture | Target Devices | Typical Size |
          |:---|:---|:---|
          | **ARM64 (arm64-v8a)** ⭐ *(Recommended)* | Nothing Phone 1/2/2a, Pixel, Samsung, OnePlus, modern 64-bit phones | **~50 MB** |
          | **ARMv7 (armeabi-v7a)** | Older 32-bit Android phones & budget devices | **~48 MB** |
          | **x86_64** | 64-bit Android Emulators (PC, Android Studio, WSA) | **~58 MB** |
          | **x86** | 32-bit PC Emulators | **~55 MB** |
          | **Universal All-in-One** | Universal bundle with all 4 engines combined | **~190 MB** |

          ---

          ## ⚡ What's New & Changelog

          ${COMMITS_LOG}

          ---

          ## 📱 Mobile App Features Included
          - **Universal Dual-Engine**: AndroidX Media3 (HW+) + LibVLC Native C++ Engine (SW+)
          - **Full Storage Scanner**: Automatically scans all directories on Internal Storage & SD Cards (excluding Android/data and Android/obb)
          - **Dolby EAC-3 5.1 / AC-3 / DTS / TrueHD Native Downmixing**: Crystal-clear surround playback with zero codec errors
          - **Zero-Black-Screen TextureView Rendering**: Direct hardware streaming without video freezing
          - **Pro Gesture Cinema Controls**: Vertical swipe brightness/volume with 200% audio boost & real-time Nothing OS HUD
          - **Multi-Track Audio & Subtitle Switchers**: Top bar dialogs for multi-language tracks and embedded subtitles
          - **Background Audio Service**: MediaStyle foreground playback service with lockscreen and Bluetooth headset controls
          - **Network Stream Player**: Direct video link playback with clipboard paste and demo streams

          ---
          *Automated Android APK build powered by GitHub Actions for NOTHING PLAYER.*
          EOF

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "🔴 Nothing Player v2.0 (Build #${{ github.run_number }})"
          body_path: release_notes.md
          files: |
            release-assets/*.apk
            release-assets/nothing-player-web-bundle.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-android
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
