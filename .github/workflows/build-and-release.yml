name: Build & Release Android APK & Deploy Pages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/nothing-player-release.jks
            echo "Release Keystore decoded successfully!"
          else
            echo "KEYSTORE_BASE64 secret not provided, using fallback build signing"
          fi

      - name: Build Android APKs
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NothingPlayer-v2.0-APKs
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Prepare Release Assets
        run: |
          ROOT_DIR=$(pwd)
          mkdir -p release-assets
          cd android/app/build/outputs/apk/debug/
          for f in *.apk; do
            if [ -f "$f" ]; then
              echo "Copying $f to $ROOT_DIR/release-assets/"
              cp "$f" "$ROOT_DIR/release-assets/${f/app-/NothingPlayer-}"
            fi
          done
          cd "$ROOT_DIR"
          if [ -f "release-assets/NothingPlayer-arm64-v8a-debug.apk" ]; then
            cp release-assets/NothingPlayer-arm64-v8a-debug.apk release-assets/NothingPlayer-v2.0-arm64.apk
          fi
          if [ -d "dist" ]; then
            cd dist && zip -r "$ROOT_DIR/release-assets/nothing-player-web-bundle.zip" . && cd "$ROOT_DIR"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          
          COMMITS_LOG=$(git log -n 10 --pretty=format:"- [%h] %s (%an)")

          cat << 'EOF' > release_notes.md
          # 🔴 NOTHING PLAYER v2.0 // MULTI-ARCH ANDROID RELEASE

          > **Build Timestamp:** $DATE  
          > **Commit:** `$COMMIT_HASH` by @$COMMIT_AUTHOR  
          > **Latest Push Note:** $COMMIT_MSG  

          ---

          ### 📲 Download APK (Choose by Architecture)

          | Architecture | Target Devices | Typical Size | Download |
          |:---|:---|:---|:---|
          | **ARM64 (arm64-v8a)** ⭐ *(Recommended)* | Nothing Phone 1/2/2a, Pixel, Samsung, OnePlus, modern 64-bit phones | **~30 MB** | [Download arm64-v8a APK](NothingPlayer-arm64-v8a-debug.apk) |
          | **ARMv7 (armeabi-v7a)** | Older 32-bit Android phones & budget devices | **~28 MB** | [Download armeabi-v7a APK](NothingPlayer-armeabi-v7a-debug.apk) |
          | **x86_64** | 64-bit Android Emulators (PC, Android Studio, WSA) | **~35 MB** | [Download x86_64 APK](NothingPlayer-x86_64-debug.apk) |
          | **x86** | 32-bit PC Emulators | **~32 MB** | [Download x86 APK](NothingPlayer-x86-debug.apk) |
          | **Universal All-in-One** | Universal bundle with all 4 engines combined | **~180 MB** | [Download Universal APK](NothingPlayer-universal-debug.apk) |

          ---

          ## ⚡ What's New & Changelog

          $COMMITS_LOG

          ---

          ## 📱 Mobile App Features Included
          - **Universal Dual-Engine**: AndroidX Media3 (HW+) + LibVLC Native C++ Engine (SW+)
          - **Dolby EAC-3 5.1 / AC-3 / DTS / TrueHD Native Downmixing**: Crystal-clear surround playback with zero codec errors
          - **Zero-Black-Screen TextureView Rendering**: Direct hardware streaming without video freezing
          - **Pro Gesture Cinema Controls**: Vertical swipe brightness/volume with 200% audio boost & real-time Nothing OS HUD
          - **Multi-Track Audio & Subtitle Switchers**: Top bar dialogs for multi-language tracks and embedded subtitles
          - **Background Audio Service**: MediaStyle foreground playback service with lockscreen and Bluetooth headset controls
          - **Detailed File Specs Sheet**: Exact storage path display with 1-tap copy button
          - **Network Stream Player**: Direct video link playback with clipboard paste and demo streams

          ---
          *Automated Android APK build powered by GitHub Actions for NOTHING PLAYER.*
          EOF

          sed -i "s/\$DATE/$DATE/g" release_notes.md
          sed -i "s/\$COMMIT_HASH/$COMMIT_HASH/g" release_notes.md
          sed -i "s/\$COMMIT_AUTHOR/$COMMIT_AUTHOR/g" release_notes.md
          sed -i "s/\$COMMIT_MSG/$COMMIT_MSG/g" release_notes.md

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "🔴 Nothing Player v2.0 (Build #${{ github.run_number }})"
          body_path: release_notes.md
          files: |
            release-assets/*.apk
            release-assets/nothing-player-web-bundle.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-android
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
