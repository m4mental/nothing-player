name: Build & Release Android APK & Deploy Pages

on:
  push:
    branches:
      - main
      - master
      - dev
      - alpha
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/nothing-player-release.jks
            echo "Release Keystore decoded successfully!"
          else
            echo "KEYSTORE_BASE64 secret not provided, using fallback build signing"
          fi

      - name: Build Android APKs
        working-directory: ./android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NothingPlayer-APKs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

      - name: Prepare Release Assets
        run: |
          ROOT_DIR=$(pwd)
          mkdir -p release-assets

          # Prefer optimized R8-shrunk Release APKs per CPU architecture
          if [ -d "android/app/build/outputs/apk/release" ] && ls android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cd android/app/build/outputs/apk/release/
            for f in *.apk; do
              if [ -f "$f" ]; then
                target_name="${f/app-/NothingPlayer-}"
                echo "Copying release $f -> $ROOT_DIR/release-assets/$target_name"
                cp "$f" "$ROOT_DIR/release-assets/$target_name"
              fi
            done
            cd "$ROOT_DIR"
          elif [ -d "android/app/build/outputs/apk/debug" ]; then
            cd android/app/build/outputs/apk/debug/
            for f in *.apk; do
              if [ -f "$f" ]; then
                target_name="${f/app-/NothingPlayer-}"
                echo "Copying debug $f -> $ROOT_DIR/release-assets/$target_name"
                cp "$f" "$ROOT_DIR/release-assets/$target_name"
              fi
            done
            cd "$ROOT_DIR"
          fi

          if [ -d "dist" ]; then
            cd dist && zip -r "$ROOT_DIR/release-assets/nothing-player-web-bundle.zip" . && cd "$ROOT_DIR"
          fi

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          COMMITS_LOG=$(git log -n 10 --pretty=format:"- [%h] %s (%an)")

          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tag_name=beta-latest" >> $GITHUB_OUTPUT
            echo "release_name=🟡 Nothing Player Beta (dev)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/alpha" ]; then
            echo "tag_name=alpha-latest" >> $GITHUB_OUTPUT
            echo "release_name=🧪 Nothing Player Alpha (experimental)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v2.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "release_name=🔴 Nothing Player v2.0 (Build #${{ github.run_number }})" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          ARM64_SIZE=$(ls -lh release-assets/*arm64-v8a*.apk 2>/dev/null | head -n1 | awk '{print $5}' || echo "~30M")
          ARMV7_SIZE=$(ls -lh release-assets/*armeabi-v7a*.apk 2>/dev/null | head -n1 | awk '{print $5}' || echo "~28M")
          X8664_SIZE=$(ls -lh release-assets/*x86_64*.apk 2>/dev/null | head -n1 | awk '{print $5}' || echo "~33M")
          X86_SIZE=$(ls -lh release-assets/*-x86-*.apk 2>/dev/null | head -n1 | awk '{print $5}' || echo "~32M")
          UNIV_SIZE=$(ls -lh release-assets/*universal*.apk 2>/dev/null | head -n1 | awk '{print $5}' || echo "~105M")

          cat << EOF > release_notes.md
          # 🔴 NOTHING PLAYER v2.0 // LIGHTWEIGHT MULTI-ARCH ANDROID RELEASE

          > **Build Timestamp:** ${DATE}  
          > **Commit:** \`${COMMIT_HASH}\` by @${COMMIT_AUTHOR}  
          > **Latest Push Note:** ${COMMIT_MSG}  

          ---

          ### 📲 Which APK should you download? (Multi-Architecture Guide)

          | APK File | CPU Architecture | Compatible Devices | Size |
          |:---|:---|:---|:---|
          | **\`NothingPlayer-arm64-v8a-release.apk\`** ⭐ | **arm64-v8a** (64-bit ARM) | **90%+ Modern Android Phones** (Nothing, Pixel, Samsung, OnePlus) | **${ARM64_SIZE}** |
          | **\`NothingPlayer-armeabi-v7a-release.apk\`** | **armeabi-v7a** (32-bit ARM) | Older 32-bit Android Phones & Budget Devices | **${ARMV7_SIZE}** |
          | **\`NothingPlayer-x86_64-release.apk\`** | **x86_64** (64-bit x86) | Android Emulators, PC (WSA) & ChromeOS | **${X8664_SIZE}** |
          | **\`NothingPlayer-x86-release.apk\`** | **x86** (32-bit x86) | Legacy 32-bit PC Emulators | **${X86_SIZE}** |
          | **\`NothingPlayer-universal-release.apk\`** | **Universal All-in-One** | Works on Any Android Device | **${UNIV_SIZE}** |

          > 💡 **Tip:** Modern Android phones use **\`NothingPlayer-arm64-v8a-release.apk\`** — lightweight, R8-shrunk, and optimized for fast launch & low memory usage.

          ---

          ## ⚡ What's New & Changelog

          ${COMMITS_LOG}

          ---

          ## 📱 Codecs & Engine Highlights
          - **Lightweight Dual-Engine**: Media3 1.7.1 + FFmpeg (HW+) + LibVLC 3.7.8 (SW+) with lazy WebView loading & R8 minification
          - **Modern Video Codecs**: AV1 (`dav1d`/`libaom`), HEVC/H.265 10-bit, Dolby Vision, VVC/H.266 fallback, VP9, H.264, RTSP & SmoothStreaming
          - **Surround & Hi-Res Audio**: Dolby Digital Plus (E-AC-3 5.1), AC-3, AC-4, TrueHD, DTS / DTS-HD, Opus, FLAC, ALAC
          EOF

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
        with:
          tag_name: ${{ steps.changelog.outputs.tag_name }}
          name: ${{ steps.changelog.outputs.release_name }}
          body_path: release_notes.md
          files: |
            release-assets/*.apk
            release-assets/nothing-player-web-bundle.zip
          draft: false
          prerelease: ${{ steps.changelog.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-android
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
