name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          # Copy Built APK
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/NothingPlayer-v1.0.apk
          # Package Web App Zip
          cd dist && zip -r ../release-assets/nothing-player-web-bundle.zip . && cd ..

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          
          # Recent commits log
          COMMITS_LOG=$(git log -n 10 --pretty=format:"- [%h] %s (%an)")

          cat << 'EOF' > release_notes.md
          # 🔴 NOTHING PLAYER (01) // ANDROID RELEASE

          > **Build Timestamp:** $DATE  
          > **Commit:** \`$COMMIT_HASH\` by @$COMMIT_AUTHOR  
          > **Latest Push Note:** $COMMIT_MSG  

          ---

          ### 📲 Download Android APK
          - **[NothingPlayer-v1.0.apk](NothingPlayer-v1.0.apk)** *(Direct install on any Android phone)*

          ---

          ## ⚡ What's New & Changelog

          $COMMITS_LOG

          ---

          ## 📱 Mobile App Features Included
          - **Dedicated Dual Hub**: [01 / MUSIC] Audiophile Deck & [02 / VIDEO] Cinema Hub
          - **VLC Mobile Touch Gestures**:
            - **Left Vertical Swipe**: Screen Brightness (0% - 150%)
            - **Right Vertical Swipe**: Volume with 200% Audio Boost
            - **Horizontal Swipe**: High-precision timeline scrub
            - **Double Tap**: Fast ±10s seek
          - **10-Band Graphic Equalizer**: Preamp boost, bass punch & acoustic presets
          - **Hardware Glyph Interface**: Dynamic LED visualizers reactive to audio frequencies
          - **Synced Lyrics & Subtitles Engine**: .LRC auto-scrolling lyrics & .SRT / .VTT video subtitles
          - **Android MediaSession**: Background audio playback, lock screen metadata & notifications
          - **Persistent Offline Media Vault**: IndexedDB file storage & multi-format support

          ---
          *Automated Android APK build powered by GitHub Actions for NOTHING PLAYER.*
          EOF

          sed -i "s/\$DATE/$DATE/g" release_notes.md
          sed -i "s/\$COMMIT_HASH/$COMMIT_HASH/g" release_notes.md
          sed -i "s/\$COMMIT_AUTHOR/$COMMIT_AUTHOR/g" release_notes.md
          sed -i "s/\$COMMIT_MSG/$COMMIT_MSG/g" release_notes.md

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: release-${{ github.sha }}
          name: "🔴 Nothing Player Android App - ${{ github.sha }}"
          body_path: release_notes.md
          files: |
            release-assets/NothingPlayer-v1.0.apk
            release-assets/nothing-player-web-bundle.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
