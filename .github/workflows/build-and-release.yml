name: Automated Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web / PWA App
        run: npm run build

      - name: Package Distribution Zip
        run: |
          mkdir -p release-assets
          cd dist && zip -r ../release-assets/nothing-player-web-app.zip . && cd ..

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          echo "Generating Changelog from commit messages..."
          DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          
          # Recent 10 commits formatted as Nothing OS changelog
          COMMITS_LOG=$(git log -n 10 --pretty=format:"- [%h] %s (%an)")

          cat << 'EOF' > release_notes.md
          # 🔴 NOTHING PLAYER (01) // AUTO RELEASE

          > **Build Timestamp:** $DATE  
          > **Commit:** \`$COMMIT_HASH\` by @$COMMIT_AUTHOR  
          > **Latest Push Note:** $COMMIT_MSG  

          ---

          ## ⚡ What's New & Changelog

          $COMMITS_LOG

          ---

          ## 📱 Features Included
          - **Dual Hub Navigation**: Dedicated [01 / MUSIC] Audiophile Deck & [02 / VIDEO] Cinema Hub
          - **VLC Mobile Touch Gestures**:
            - Left Vertical Swipe: Brightness (0% - 100%)
            - Right Vertical Swipe: Volume (0% - 200% Audio Boost)
            - Horizontal Swipe: High precision seeking
            - Double Tap: ±10s fast jump
          - **Nothing Tech Aesthetics**: NDot Matrix typography, reactive Glyph LED lighting, Nothing Red accents
          - **10-Band Graphic Equalizer**: Preamp boost, bass punch & acoustic presets
          - **Persistent Media Vault**: Drag & drop audio/video with IndexedDB offline storage
          - **Synced Lyrics & Subtitles Engine**: .LRC auto-scrolling lyrics & .SRT / .VTT video subtitles
          - **Global Internet Radio Tuner**: 24/7 live stream broadcasts

          ---
          *Automated CI/CD build powered by GitHub Actions for NOTHING PLAYER.*
          EOF

          # Replace variables in release_notes.md
          sed -i "s/\$DATE/$DATE/g" release_notes.md
          sed -i "s/\$COMMIT_HASH/$COMMIT_HASH/g" release_notes.md
          sed -i "s/\$COMMIT_AUTHOR/$COMMIT_AUTHOR/g" release_notes.md
          sed -i "s/\$COMMIT_MSG/$COMMIT_MSG/g" release_notes.md

      - name: Create Tag & GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: release-${{ github.sha }}
          name: "🔴 Nothing Player Build - ${{ github.sha }}"
          body_path: release_notes.md
          files: |
            release-assets/nothing-player-web-app.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
