name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35 & Accept Licenses
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NothingPlayer-v2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/NothingPlayer-v2.0.apk
          cd dist && zip -r ../release-assets/nothing-player-web-bundle.zip . && cd ..

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          
          COMMITS_LOG=$(git log -n 10 --pretty=format:"- [%h] %s (%an)")

          cat << 'EOF' > release_notes.md
          # 🔴 NOTHING PLAYER v2.0 // ANDROID RELEASE

          > **Build Timestamp:** $DATE  
          > **Commit:** `$COMMIT_HASH` by @$COMMIT_AUTHOR  
          > **Latest Push Note:** $COMMIT_MSG  

          ---

          ### 📲 Download Android APK
          - **[NothingPlayer-v2.0.apk](NothingPlayer-v2.0.apk)** *(Direct install on any Android phone)*

          ---

          ## ⚡ What's New & Changelog

          $COMMITS_LOG

          ---

          ## 📱 Mobile App Features Included
          - **Universal Dual-Engine**: AndroidX Media3 (HW+) + LibVLC Native C++ Engine (SW+)
          - **Dolby EAC-3 5.1 / AC-3 / DTS / TrueHD Native Downmixing**: Crystal-clear surround playback with zero codec errors
          - **Zero-Black-Screen TextureView Rendering**: Direct hardware streaming without video freezing
          - **Pro Gesture Cinema Controls**: Vertical swipe brightness/volume with 200% audio boost & real-time Nothing OS HUD
          - **Multi-Track Audio & Subtitle Switchers**: Top bar dialogs for multi-language tracks and embedded subtitles
          - **Background Audio Service**: MediaStyle foreground playback service with lockscreen and Bluetooth headset controls
          - **Detailed File Specs Sheet**: Exact storage path display with 1-tap copy button
          - **Network Stream Player**: Direct video link playback with clipboard paste and demo streams

          ---
          *Automated Android APK build powered by GitHub Actions for NOTHING PLAYER.*
          EOF

          sed -i "s/\$DATE/$DATE/g" release_notes.md
          sed -i "s/\$COMMIT_HASH/$COMMIT_HASH/g" release_notes.md
          sed -i "s/\$COMMIT_AUTHOR/$COMMIT_AUTHOR/g" release_notes.md
          sed -i "s/\$COMMIT_MSG/$COMMIT_MSG/g" release_notes.md

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "🔴 Nothing Player v2.0 (Build #${{ github.run_number }})"
          body_path: release_notes.md
          files: |
            release-assets/NothingPlayer-v2.0.apk
            release-assets/nothing-player-web-bundle.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
